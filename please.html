<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f5">
  <title>Pleaseee?</title>
  <style>
    :root {
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: #49333a;
      background: #fff7f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 12% 18%, #ffe6e2 0, transparent 27rem),
        radial-gradient(ellipse at 90% 86%, #fce4ed 0, transparent 30rem),
        #fff7f5;
    }

    main {
      width: min(100%, 480px);
      padding: clamp(32px, 8vw, 56px) 28px;
      border: 1px solid rgb(255 255 255 / 85%);
      border-radius: 30px;
      background: rgb(255 255 255 / 82%);
      box-shadow: 0 24px 80px rgb(111 54 73 / 12%);
      text-align: center;
    }

    img {
      width: 160px;
      height: 160px;
      margin-bottom: 24px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 5px 16px rgb(191 82 103 / 18%);
    }

    h1 {
      margin: 0;
      color: #49333a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 12vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.055em;
    }

    p {
      margin: 16px 0 0;
      color: #846e74;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 26px;
      padding: 13px 28px;
      border-radius: 999px;
      background: #bd6b7b;
      box-shadow: 0 8px 18px rgb(189 107 123 / 25%);
      color: white;
      font-size: 0.98rem;
      font-weight: 650;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease;
    }

    a:hover {
      transform: translateY(-2px);
      background: #a95768;
    }

    a:focus-visible {
      outline: 3px solid #49333a;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <img src="no-cat.gif" alt="A cute, slightly grumpy kitten">
    <h1>pleaseee?</h1>
    <p>i have a gift for you man ):</p>
    <a href="index.html">Go back</a>
  </main>
</body>
</html>
